{% extends "base.html" %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6">
    <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Ringkasan Operasional (Bulan Ini)</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <!-- Card 1 -->
        <div class="bg-blue-50 border border-blue-100 rounded p-4">
            <h3 class="text-gray-500 text-sm font-medium">Total Pengeluaran</h3>
            <p class="text-3xl font-bold text-blue-700">Rp 0</p>
        </div>
        <!-- Card 2 -->
        <div class="bg-green-50 border border-green-100 rounded p-4">
            <h3 class="text-gray-500 text-sm font-medium">Rata-rata Konsumsi BBM</h3>
            <p class="text-3xl font-bold text-green-700">0 KM/L</p>
        </div>
        <!-- Card 3 -->
        <div class="bg-red-50 border border-red-100 rounded p-4">
            <h3 class="text-gray-500 text-sm font-medium">Prediksi Servis Terdekat</h3>
            <p class="text-lg font-bold text-red-700 mt-2">Belum ada data</p>
        </div>
    </div>

    <div class="mt-6 flex justify-between items-center border-t pt-4">
        <h3 class="text-xl font-medium">Aktivitas Terakhir</h3>
        <button class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
            Unduh Laporan Excel
        </button>
    </div>
    
    <div class="mt-4 overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-100 text-gray-700">
                    <th class="p-3 border-b">Tanggal</th>
                    <th class="p-3 border-b">Kendaraan</th>
                    <th class="p-3 border-b">Kategori</th>
                    <th class="p-3 border-b">Detail</th>
                    <th class="p-3 border-b">Biaya (Rp)</th>
                    <th class="p-3 border-b text-center">Aksi</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6" class="p-4 text-center text-gray-500">Belum ada data dari Bot Telegram.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
